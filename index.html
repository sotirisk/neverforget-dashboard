<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeverForget - Dashboard</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 40px; background-color: #f4f5f7; color: #333; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto 20px auto; }
        textarea { width: 100%; height: 140px; margin-top: 10px; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"], input[type="password"] { margin-bottom: 15px; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2563eb; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .btn-secondary { background-color: #475569; margin-top: 10px; }
        #status { margin-top: 15px; font-weight: bold; word-break: break-word; }
        .config-group { margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .config-group label { font-size: 13px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }

        /* Flashcard Viewer Styles */
        .flashcard-display {
            min-height: 180px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            background-color: #fafafa;
            user-select: none;
            margin-bottom: 15px;
        }
        .controls { display: flex; gap: 10px; }
        .controls button { flex: 1; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #e2e8f0; margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- Setup & Ingestion Card -->
<div class="card">
    <h2>NeverForget - Content Ingestion</h2>
    
    <div class="config-group">
        <label for="apiKeyInput">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API Key (AIzaSy...)" />
        
        <label for="supabaseKeyInput">Supabase Anon Key:</label>
        <input type="password" id="supabaseKeyInput" placeholder="Paste your Supabase Anon Key" />
    </div>

    <p>Upload a text file (.txt, .md) or paste your notes below:</p>
    
    <input type="file" id="fileInput" accept=".txt,.md">
    <p style="text-align: center; color: #666; margin: 5px 0;">or</p>
    
    <textarea id="textInput" placeholder="Paste your notes here..."></textarea>
    
    <button id="processBtn" onclick="processContent()">Process & Generate Flashcards</button>
    <div id="status"></div>
</div>

<!-- Review Interface Card -->
<div class="card">
    <h2>Flashcard Review</h2>
    <button class="btn-secondary" onclick="loadFlashcards()">Load Cards from Supabase</button>
    
    <div id="reviewSection" style="display: none; margin-top: 20px;">
        <span id="cardProgress" class="badge">Card 0 of 0</span>
        <span id="cardSide" class="badge" style="background: #dbeafe; color: #1e40af;">Question</span>
        
        <div id="cardBox" class="flashcard-display" onclick="flipCard()">
            Click "Load Cards" to begin.
        </div>

        <div class="controls">
            <button onclick="prevCard()" class="btn-secondary">Previous</button>
            <button onclick="flipCard()">Flip</button>
            <button onclick="nextCard()">Next</button>
        </div>

        <div id="ai-section" style="margin-top: 15px; border-top: 1px solid #e0e0e0; padding-top: 10px;">
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <input
                    type="text"
                    id="ai-question-input"
                    placeholder="Ask about this card (e.g., What is scheme?)..."
                    style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
                />
                <button
                    id="ask-ai-btn"
                    onclick="askAIAboutCard()"
                    style="padding: 8px 16px; background-color: #10a37f; color: white; border: none; border-radius: 4px; cursor: pointer;"
                >
                    Ask AI
                </button>
            </div>

            <div
                id="ai-response-box"
                style="margin-top: 10px; padding: 10px; background-color: #f8f9fa; border-radius: 4px; font-size: 14px; display: none;"
            ></div>
            <button
                id="create-card-btn"
                onclick="createCardFromAIAnswer()"
                style="margin-top: 10px; padding: 8px 16px; background-color: #2563eb; display: none;"
            >
                Create Card
            </button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://drfsdxongvpgvdcoibxd.supabase.co';
    let supabaseClient = null;

    let cards = [];
    let currentIndex = 0;
    let showingAnswer = false;
    let lastAIQuestion = '';
    let lastAIAnswer = '';

    // Load credentials on startup
    document.addEventListener('DOMContentLoaded', async () => {
        const savedGeminiKey = localStorage.getItem('GEMINI_API_KEY');
        if (savedGeminiKey) document.getElementById('apiKeyInput').value = savedGeminiKey;

        const savedSupabaseKey = localStorage.getItem('SUPABASE_ANON_KEY');
        if (savedSupabaseKey) {
            document.getElementById('supabaseKeyInput').value = savedSupabaseKey;
            initSupabase(savedSupabaseKey);
        }

        try {
            const configResponse = await fetch('config.json');
            if (configResponse.ok) {
                const config = await configResponse.json();
                if (config.SUPABASE_ANON_KEY) {
                    document.getElementById('supabaseKeyInput').value = config.SUPABASE_ANON_KEY;
                    localStorage.setItem('SUPABASE_ANON_KEY', config.SUPABASE_ANON_KEY);
                    initSupabase(config.SUPABASE_ANON_KEY);
                }
                if (config.GEMINI_API_KEY) {
                    document.getElementById('apiKeyInput').value = config.GEMINI_API_KEY;
                    localStorage.setItem('GEMINI_API_KEY', config.GEMINI_API_KEY);
                }
            }
        } catch (e) {
            console.log('No local config.json file found.');
        }
    });

    function initSupabase(key) {
        if (key) {
            supabaseClient = supabase.createClient(SUPABASE_URL, key);
        }
    }

    // Ingestion Logic
    async function processContent() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const supabaseKey = document.getElementById('supabaseKeyInput').value.trim();
        const content = document.getElementById('textInput').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('processBtn');

        if (!apiKey || !supabaseKey || !content) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Error: API keys and content text are required.';
            return;
        }

        localStorage.setItem('GEMINI_API_KEY', apiKey);
        localStorage.setItem('SUPABASE_ANON_KEY', supabaseKey);
        initSupabase(supabaseKey);

        btn.disabled = true;
        statusDiv.style.color = 'blue';
        statusDiv.innerText = '1/2: Generating flashcards via Gemini AI...';

        try {
            const prompt = `You are a flashcard creation assistant. Analyze the following text and generate structured flashcards.
Return ONLY a valid JSON array of objects with keys "question" and "answer". Do not include Markdown code blocks or any other formatting.

Text to process:
${content}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(`Gemini API Error: ${data.error ? data.error.message : 'Unknown error'}`);

            const flashcards = JSON.parse(data.candidates[0].content.parts[0].text);
            statusDiv.innerText = `2/2: Saving ${flashcards.length} flashcards to Supabase...`;

            const recordsToInsert = flashcards.map(card => ({
                user_id: crypto.randomUUID(),
                question: card.question,
                answer: card.answer,
                interval: 0,
                ease_factor: 2.5
            }));

            const { error: dbError } = await supabaseClient.from('flashcards').insert(recordsToInsert);
            if (dbError) throw dbError;

            statusDiv.style.color = 'green';
            statusDiv.innerText = `Success! Created and stored ${flashcards.length} flashcards in Supabase.`;
            document.getElementById('textInput').value = '';
            
            // Reload viewer stack automatically
            loadFlashcards();

        } catch (err) {
            console.error(err);
            statusDiv.style.color = 'red';
            statusDiv.innerText = `Error: ${err.message}`;
        } finally {
            btn.disabled = false;
        }
    }

    // Flashcard Review Logic
    async function loadFlashcards() {
        const supabaseKey = document.getElementById('supabaseKeyInput').value.trim();
        if (!supabaseKey) {
            alert('Please provide your Supabase Anon Key first.');
            return;
        }
        
        initSupabase(supabaseKey);

        const { data, error } = await supabaseClient
            .from('flashcards')
            .select('id, question, answer')
            .order('created_at', { ascending: false });

        if (error) {
            alert('Error loading cards: ' + error.message);
            return;
        }

        if (!data || data.length === 0) {
            alert('No flashcards found in database.');
            return;
        }

        cards = data;
        currentIndex = 0;
        showingAnswer = false;
        
        document.getElementById('reviewSection').style.display = 'block';
        renderCard();
    }

    function renderCard() {
        if (cards.length === 0) return;
        const currentCard = cards[currentIndex];
        const cardBox = document.getElementById('cardBox');
        const cardSide = document.getElementById('cardSide');
        const cardProgress = document.getElementById('cardProgress');

        cardProgress.innerText = `Card ${currentIndex + 1} of ${cards.length}`;

        if (showingAnswer) {
            cardBox.innerText = currentCard.answer;
            cardBox.style.backgroundColor = '#f0fdf4'; // Subtle green tint for answers
            cardSide.innerText = 'Answer';
            cardSide.style.background = '#dcfce7';
            cardSide.style.color = '#166534';
        } else {
            cardBox.innerText = currentCard.question;
            cardBox.style.backgroundColor = '#fafafa';
            cardSide.innerText = 'Question';
            cardSide.style.background = '#dbeafe';
            cardSide.style.color = '#1e40af';
        }
    }

    function flipCard() {
        if (cards.length === 0) return;
        showingAnswer = !showingAnswer;
        renderCard();
    }

    function nextCard() {
        if (cards.length === 0) return;
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            showingAnswer = false;
            renderCard();
        }
    }

    function prevCard() {
        if (cards.length === 0) return;
        if (currentIndex > 0) {
            currentIndex--;
            showingAnswer = false;
            renderCard();
        }
    }

    async function askAIAboutCard() {
        const inputEl = document.getElementById('ai-question-input');
        const responseBox = document.getElementById('ai-response-box');
        const askButton = document.getElementById('ask-ai-btn');
        const createCardButton = document.getElementById('create-card-btn');
        const userQuery = inputEl.value.trim();
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const cardText = document.getElementById('cardBox')?.innerText || '';

        if (!userQuery || !apiKey || !cardText) return;

        responseBox.style.display = 'block';
        responseBox.innerHTML = '<em>Thinking...</em>';
        createCardButton.style.display = 'none';
        askButton.disabled = true;

        try {
            const prompt = `You are creating a high-quality study flashcard from a learner's follow-up question.
Use the active flashcard and the learner's question to infer the intended concept.
Rewrite vague or conversational wording into a precise, standalone flashcard question.
For example, rewrite "what is scheme in this context" as "What is a scheme in the context of web URLs?"
Return ONLY valid JSON with exactly these keys: "question" and "answer".
The answer should be concise, accurate, and easy to understand.

Active Flashcard: "${cardText}"
Learner Question: "${userQuery}"`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: 'application/json' }
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error?.message || 'Gemini API request failed.');
            }

            const generatedCard = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || '{}');
            if (!generatedCard.question || !generatedCard.answer) {
                throw new Error('Gemini returned an incomplete flashcard.');
            }

            lastAIQuestion = generatedCard.question;
            lastAIAnswer = generatedCard.answer;
            responseBox.innerText = lastAIAnswer;
            createCardButton.style.display = 'block';
            inputEl.value = '';
        } catch (err) {
            console.error(err);
            responseBox.innerText = 'Error connecting to AI assistant. Check your API key and network connection.';
        } finally {
            askButton.disabled = false;
        }
    }

    async function createCardFromAIAnswer() {
        const createCardButton = document.getElementById('create-card-btn');
        const supabaseKey = document.getElementById('supabaseKeyInput').value.trim();

        if (!lastAIQuestion || !lastAIAnswer || !supabaseKey) {
            alert('Please provide a Supabase Anon Key and ask a question first.');
            return;
        }

        initSupabase(supabaseKey);
        createCardButton.disabled = true;

        try {
            const { error } = await supabaseClient.from('flashcards').insert({
                user_id: crypto.randomUUID(),
                question: lastAIQuestion,
                answer: lastAIAnswer,
                interval: 0,
                ease_factor: 2.5
            });

            if (error) throw error;

            createCardButton.innerText = 'Card Created';
            await loadFlashcards();
        } catch (err) {
            console.error(err);
            alert(`Error creating card: ${err.message}`);
        } finally {
            createCardButton.disabled = false;
        }
    }
</script>

</body>
</html>
