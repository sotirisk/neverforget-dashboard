<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeverForget - Content Ingestion</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 40px; background-color: #f4f5f7; color: #333; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        textarea { width: 100%; height: 180px; margin-top: 10px; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"], input[type="password"] { margin-bottom: 15px; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2563eb; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; word-break: break-word; }
        .config-group { margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .config-group label { font-size: 13px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>NeverForget - Content Ingestion</h2>
    
    <!-- Gemini API Key Input Field -->
    <div class="config-group">
        <label for="apiKeyInput">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API Key here (AIzaSy...)" />
    </div>

    <p>Upload a text file (.txt, .md) or paste your notes below:</p>
    
    <input type="file" id="fileInput" accept=".txt,.md">
    <p style="text-align: center; color: #666; margin: 5px 0;">or</p>
    
    <textarea id="textInput" placeholder="Paste your notes here..."></textarea>
    
    <button id="processBtn" onclick="processContent()">Process & Generate Flashcards</button>
    
    <div id="status"></div>
</div>

<script>
    // 1. Supabase Initialization (Static Anon Key)
    const SUPABASE_URL = 'https://xzjplfckvjylqghxeybg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZnNkeG9uZ3ZwZ3ZkY29pYnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDA2NjUsImV4cCI6MjEwNDQxNjY2NX0.AMFYn1Br_tCXu0C5eI_f1oS8s90NBwWPitxF66YpeWI'; // Replace with your actual Supabase Anon Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Load stored Gemini API Key on page load
    document.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('GEMINI_API_KEY');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
    });

    // 3. File Reader Logic
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('textInput').value = e.target.result;
        };
        reader.readAsText(file);
    });

    // 4. Main Processing Function
    async function processContent() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const content = document.getElementById('textInput').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('processBtn');

        if (!apiKey) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Error: Please enter your Gemini API Key.';
            return;
        }

        if (!content) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Error: Please provide text content or select a file.';
            return;
        }

        // Save API Key locally for future sessions
        localStorage.setItem('GEMINI_API_KEY', apiKey);

        btn.disabled = true;
        statusDiv.style.color = 'blue';
        statusDiv.innerText = '1/2: Generating flashcards via Gemini AI...';

        try {
            // Prompt construction
            const prompt = `You are a flashcard creation assistant. Analyze the following text and generate structured flashcards (Front/Question and Back/Answer).
Return ONLY a valid JSON array of objects with keys "front" and "back". Do not include Markdown code blocks or any other formatting.

Text to process:
${content}`;

            // Call Gemini API (using gemini-1.5-flash)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(`Gemini API Error: ${data.error ? data.error.message : 'Unknown error'}`);
            }

            const rawText = data.candidates[0].content.parts[0].text;
            const flashcards = JSON.parse(rawText);

            statusDiv.innerText = `2/2: Saving ${flashcards.length} flashcards to Supabase...`;

            // Prepare records for Supabase insert
            const recordsToInsert = flashcards.map(card => ({
                front: card.front,
                back: card.back
            }));

            const { data: dbData, error: dbError } = await supabaseClient
                .from('flashcards')
                .insert(recordsToInsert);

            if (dbError) throw dbError;

            statusDiv.style.color = 'green';
            statusDiv.innerText = `Success! Created and stored ${flashcards.length} flashcards in Supabase.`;
            document.getElementById('textInput').value = '';
            document.getElementById('fileInput').value = '';

        } catch (err) {
            console.error(err);
            statusDiv.style.color = 'red';
            statusDiv.innerText = `Error: ${err.message}`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
